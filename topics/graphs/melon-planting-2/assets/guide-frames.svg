<svg xmlns="http://www.w3.org/2000/svg" width="560" height="310" viewBox="0 0 560 310" role="img" aria-labelledby="title description">
  <title id="title">Guide frames and a terminal harvest</title>
  <desc id="description">L1 can reach R1 or R2; L2 can only reach R2. L1 grows into R2, stopping both vines.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#1268b3" />
    </marker>
    <marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#20354b" />
    </marker>
    <pattern id="removed" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#fff5dd" />
      <path d="M -2 2 L 2 -2 M 0 10 L 10 0 M 8 12 L 12 8" stroke="#dba963" stroke-width="1.2" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="560" height="310" fill="white" stroke="none" />
  <line x1="130" y1="85" x2="425" y2="85" stroke="#acb9c6" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6" />
  <line x1="130" y1="85" x2="425" y2="205" stroke="#acb9c6" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6" />
  <line x1="130" y1="205" x2="425" y2="205" stroke="#acb9c6" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6" />
  <line x1="158" y1="96" x2="392" y2="192" stroke="#1268b3" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)" />
  <circle cx="130" cy="85" r="28" fill="#e5f3ea" stroke="#20354b" stroke-width="2" />
  <text x="130" y="92" fill="#20354b" font-size="21" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">L1</text>
  <circle cx="130" cy="205" r="28" fill="#e5f3ea" stroke="#20354b" stroke-width="2" />
  <text x="130" y="212" fill="#20354b" font-size="21" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">L2</text>
  <rect x="395" y="55" width="60" height="60" fill="white" stroke="#20354b" />
  <text x="425" y="93" fill="#20354b" font-size="21" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">R1</text>
  <rect x="395" y="175" width="60" height="60" fill="white" stroke="#20354b" />
  <circle cx="425" cy="205" r="23" fill="#fff3cf" stroke="#a85a04" stroke-width="2" />
  <text x="425" y="213" fill="#20354b" font-size="23" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">M</text>
  <text x="425" y="263" fill="#20354b" font-size="20" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">R2</text>
</svg>
