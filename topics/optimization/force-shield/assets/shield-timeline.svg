<svg xmlns="http://www.w3.org/2000/svg" width="814" height="350" viewBox="0 0 814 350" role="img" aria-labelledby="title description">
  <title id="title">Shield activation and later construction</title>
  <desc id="description">An activation at time 1 protects A through time 3. B is completed at time 2 and is not protected. The device cools down at time 4 and is available again at time 5.</desc>
