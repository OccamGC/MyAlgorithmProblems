<svg xmlns="http://www.w3.org/2000/svg" width="850" height="325" viewBox="0 0 850 325">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Arial, sans-serif" font-size="20" fill="#172033">
<line x1="145.00" y1="135.00" x2="400.00" y2="135.00" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="450.00" y1="135.00" x2="705.00" y2="135.00" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="120" cy="135" r="25" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="120" y="142" font-size="20" fill="#172033" text-anchor="middle">1</text>
<circle cx="425" cy="135" r="25" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="425" y="142" font-size="20" fill="#172033" text-anchor="middle">2</text>
<circle cx="730" cy="135" r="25" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="730" y="142" font-size="20" fill="#172033" text-anchor="middle">3</text>
<text x="272" y="95" font-size="25" fill="#2563eb" text-anchor="middle">2 → 1</text>
<text x="578" y="95" font-size="25" fill="#2563eb" text-anchor="middle">1 → 0</text>
<text x="272" y="177" font-size="19" fill="#172033" text-anchor="middle">D₁ = 1</text>
<text x="578" y="177" font-size="19" fill="#172033" text-anchor="middle">D₂ = 0</text>
<text x="120" y="221" font-size="20" fill="#172033" text-anchor="middle">T₁ = 1</text>
<text x="425" y="221" font-size="20" fill="#172033" text-anchor="middle">A₂ = T₂ = 2</text>
<text x="730" y="221" font-size="20" fill="#172033" text-anchor="middle">A₃ = 2</text>
<text x="425" y="284" font-size="20" fill="#172033" text-anchor="middle">2 × (2 − 1) + 2 × (2 − 1) + 3 × (2 − 2) = 4</text>
