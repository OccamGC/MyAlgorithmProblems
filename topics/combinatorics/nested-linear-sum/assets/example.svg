<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718096"/></marker></defs><rect width="100%" height="100%" fill="#f7fafc"/><text x="460" y="36" fill="#19344a" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">n = 2, m = 3, k = 2, c = 1</text><rect x="21" y="65" width="128" height="112" rx="12" fill="white" stroke="#cbd8e2"/><text x="85" y="105" fill="#19344a" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">(1, 1)</text><text x="85" y="152" fill="#19344a" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">2·1+1 = 3</text><rect x="171" y="65" width="128" height="112" rx="12" fill="white" stroke="#cbd8e2"/><text x="235" y="105" fill="#19344a" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">(1, 2)</text><text x="235" y="152" fill="#19344a" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">2·1+1 = 3</text><rect x="321" y="65" width="128" height="112" rx="12" fill="white" stroke="#cbd8e2"/><text x="385" y="105" fill="#19344a" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">(1, 3)</text><text x="385" y="152" fill="#19344a" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">2·1+1 = 3</text><rect x="471" y="65" width="128" height="112" rx="12" fill="white" stroke="#cbd8e2"/><text x="535" y="105" fill="#19344a" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">(2, 2)</text><text x="535" y="152" fill="#19344a" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">2·2+1 = 5</text><rect x="621" y="65" width="128" height="112" rx="12" fill="white" stroke="#cbd8e2"/><text x="685" y="105" fill="#19344a" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">(2, 3)</text><text x="685" y="152" fill="#19344a" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">2·2+1 = 5</text><rect x="771" y="65" width="128" height="112" rx="12" fill="white" stroke="#cbd8e2"/><text x="835" y="105" fill="#19344a" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">(3, 3)</text><text x="835" y="152" fill="#19344a" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">2·3+1 = 7</text><text x="460" y="228" fill="#19344a" font-family="Arial, sans-serif" font-size="26" text-anchor="middle">3 + 3 + 3 + 5 + 5 + 7 = 26</text></svg>
