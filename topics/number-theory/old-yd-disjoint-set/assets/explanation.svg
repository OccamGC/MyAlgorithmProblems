<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#205b99"/></marker></defs><rect width="960" height="420" fill="white"/><rect x="364" y="36" width="232" height="80" rx="10" fill="#eef5fb" stroke="#205b99" stroke-width="2"/><text x="480" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="30" fill="#152b43" text-anchor="middle">f(3)</text><path d="M422,118 L266,242" fill="none" stroke="#205b99" stroke-width="3" marker-end="url(#arrow)"/><path d="M538,118 L694,242" fill="none" stroke="#205b99" stroke-width="3" marker-end="url(#arrow)"/><text x="315" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#152b43" text-anchor="middle">C = 7</text><text x="650" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#152b43" text-anchor="middle">D = 4</text><rect x="123" y="245" width="282" height="78" rx="10" fill="#eef5fb" stroke="#15766e" stroke-width="2"/><rect x="553" y="245" width="282" height="78" rx="10" fill="#eef5fb" stroke="#15766e" stroke-width="2"/><text x="264" y="294" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#152b43" text-anchor="middle">f(2) = 1</text><text x="694" y="294" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#152b43" text-anchor="middle">f(3 − e) = 1</text><text x="480" y="378" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#152b43" text-anchor="middle">7 × 1 + 4 × 1 = 11</text></svg>
