<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#506680"/></marker></defs><rect width="800" height="320" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="35" font-size="22" fill="#172b4d" text-anchor="middle">L = 4，容量 = 4</text><path d="M130,120 L670,120" fill="none" stroke="#506680" stroke-width="3"/><circle cx="130" cy="120" r="24" fill="#edf2fa" stroke="#506680" stroke-width="2"/><text x="130" y="128" font-size="22" fill="#172b4d" text-anchor="middle">0</text><circle cx="400" cy="120" r="24" fill="#edf2fa" stroke="#506680" stroke-width="2"/><text x="400" y="128" font-size="22" fill="#172b4d" text-anchor="middle">2</text><circle cx="670" cy="120" r="24" fill="#edf2fa" stroke="#506680" stroke-width="2"/><text x="670" y="128" font-size="22" fill="#172b4d" text-anchor="middle">4</text><text x="130" y="183" font-size="20" fill="#172b4d" text-anchor="middle">单价 5</text><text x="400" y="183" font-size="20" fill="#172b4d" text-anchor="middle">单价 1</text><text x="670" y="183" font-size="20" fill="#172b4d" text-anchor="middle">终点</text><text x="400" y="242" font-size="22" fill="#172b4d" text-anchor="middle">最低费用：2 × 5 + 2 × 1 = 12</text><text x="400" y="288" font-size="20" fill="#172b4d" text-anchor="middle">最少次数：在位置 0 一次买 4 单位</text></g></svg>
