<text x="70" y="346" font-size="18" text-anchor="middle" fill="#18324a">0</text>
<circle cx="380" cy="318" r="6" fill="#18324a" stroke="#18324a" stroke-width="2.5"/>
<text x="380" y="346" font-size="18" text-anchor="middle" fill="#18324a">u</text>
<circle cx="194" cy="162" r="6" fill="#18324a" stroke="#18324a" stroke-width="2.5"/>
<text x="194" y="146" font-size="18" text-anchor="middle" fill="#18324a">w</text>
<circle cx="504" cy="162" r="6" fill="#18324a" stroke="#18324a" stroke-width="2.5"/>
<text x="504" y="146" font-size="18" text-anchor="middle" fill="#18324a">u+w</text>
<polyline points="557,132 594,132" fill="none" stroke="#2676bb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="605" y="138" font-size="16" text-anchor="start" fill="#18324a">U、U+w</text>
<polyline points="557,176 594,176" fill="none" stroke="#bd6516" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/>
<text x="605" y="182" font-size="16" text-anchor="start" fill="#18324a">V、V+u</text>
<text x="557" y="243" font-size="16" text-anchor="start" fill="#18324a">端点四边形面积</text>
<text x="557" y="273" font-size="18" text-anchor="start" fill="#18324a">det(u,w) = 15</text>
<text x="24" y="388" font-size="16" text-anchor="start" fill="#18324a">浅色四边形只表示端点面积；折线表示比较中的实际路径。</text>
<text x="24" y="413" font-size="16" text-anchor="start" fill="#18324a">这是假设四个锚点同时存在后的矛盾示意，不是合法森林。</text>
</g></svg>
