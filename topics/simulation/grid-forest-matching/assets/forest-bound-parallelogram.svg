<circle cx="132" cy="214" r="1.6" fill="#d6e0e8"/>
<circle cx="194" cy="214" r="1.6" fill="#d6e0e8"/>
<circle cx="256" cy="214" r="1.6" fill="#d6e0e8"/>
<circle cx="318" cy="214" r="1.6" fill="#d6e0e8"/>
<circle cx="380" cy="214" r="1.6" fill="#d6e0e8"/>
<circle cx="442" cy="214" r="1.6" fill="#d6e0e8"/>
<circle cx="504" cy="214" r="1.6" fill="#d6e0e8"/>
<circle cx="70" cy="162" r="1.6" fill="#d6e0e8"/>
<circle cx="132" cy="162" r="1.6" fill="#d6e0e8"/>
<circle cx="194" cy="162" r="1.6" fill="#d6e0e8"/>
<circle cx="256" cy="162" r="1.6" fill="#d6e0e8"/>
