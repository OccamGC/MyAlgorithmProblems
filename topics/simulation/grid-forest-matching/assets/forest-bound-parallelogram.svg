<circle cx="132" cy="110" r="1.6" fill="#d6e0e8"/>
<circle cx="194" cy="110" r="1.6" fill="#d6e0e8"/>
<circle cx="256" cy="110" r="1.6" fill="#d6e0e8"/>
<circle cx="318" cy="110" r="1.6" fill="#d6e0e8"/>
<circle cx="380" cy="110" r="1.6" fill="#d6e0e8"/>
<circle cx="442" cy="110" r="1.6" fill="#d6e0e8"/>
<circle cx="504" cy="110" r="1.6" fill="#d6e0e8"/>
<polygon points="70,318 380,318 504,162 194,162" fill="#2676bb" fill-opacity="0.07"/>
<polyline points="70,318 70,266 380,266 380,318" fill="none" stroke="#2676bb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="194,162 194,110 504,110 504,162" fill="none" stroke="#2676bb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="70,318 70,266 194,266 194,162" fill="none" stroke="#bd6516" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/>
<polyline points="380,318 380,266 504,266 504,162" fill="none" stroke="#bd6516" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/>
<polyline points="256,266 318,266" fill="none" stroke="#2676bb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<polyline points="318,110 380,110" fill="none" stroke="#2676bb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<polyline points="194,214 194,182.79999999999998" fill="none" stroke="#bd6516" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#orange-arrow)"/>
