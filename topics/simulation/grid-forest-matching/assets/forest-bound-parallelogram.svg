<svg xmlns="http://www.w3.org/2000/svg" width="740" height="430" viewBox="0 0 740 430" role="img" aria-labelledby="title desc">
<title id="title">反证示意：四条路径成对平移，允许重叠与折返</title><desc id="desc">Hypothetical anchors at zero, u, w, and u+w force translated paths U, V, U+w, V+u. Dashed orange and solid blue paths overlap. Their closed traversal has signed area det(u,w)=15, impossible in a tree.</desc>
<defs>
<marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#2676bb"/></marker>
<marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#bd6516"/></marker>
</defs><rect width="740" height="430" fill="white"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#18324a">
<text x="24" y="34" font-size="22" text-anchor="start" fill="#18324a">反证示意：四条路径成对平移，允许重叠与折返</text>
<text x="24" y="65" font-size="16" text-anchor="start" fill="#18324a">u = (5, 0)，w = (2, 3)；蓝橙重叠的部分并不影响面积计算。</text>
<circle cx="70" cy="318" r="1.6" fill="#d6e0e8"/>
