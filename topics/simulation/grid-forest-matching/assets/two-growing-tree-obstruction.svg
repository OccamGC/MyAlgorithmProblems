<svg xmlns="http://www.w3.org/2000/svg" width="660" height="690" viewBox="0 0 660 690" role="img" aria-labelledby="title desc">
<title id="title">Two growing grid paths that cannot be joined into an induced tree</title>
<desc id="desc">An eleven by eleven example contains an outer path A with 37 vertices and an inner path B with 13 vertices. Sixteen cross-marked cells separate them. Adding any of these cells creates a cycle with path A.</desc>
