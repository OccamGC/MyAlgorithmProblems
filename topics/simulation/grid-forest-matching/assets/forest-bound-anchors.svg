<svg xmlns="http://www.w3.org/2000/svg" width="740" height="408" viewBox="0 0 740 408" role="img" aria-labelledby="title desc">
<title id="title">固定一格道路，把覆盖它的副本改写为锚点</title><desc id="desc">A three-vertex horizontal template has seven valid starts on a nine-vertex road. Exactly three copies cover vertex four, corresponding to template anchors two, one, and zero.</desc>
<defs>
<marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#2676bb"/></marker>
<marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#bd6516"/></marker>
</defs><rect width="740" height="408" fill="white"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#18324a">
<text x="24" y="34" font-size="22" text-anchor="start" fill="#18324a">固定一格道路，把覆盖它的副本改写为锚点</text>
<text x="24" y="65" font-size="17" text-anchor="start" fill="#18324a">模板 P = {0, 1, 2}；道路 F = {0, …, 8}；固定 v = 4</text>
<polyline points="58,124 674,124" fill="none" stroke="#8ca0b1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="366,110 366,339" fill="none" stroke="#bd6516" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 5"/>
<circle cx="58" cy="124" r="5" fill="#8ca0b1" stroke="#8ca0b1" stroke-width="2.5"/>
<text x="58" y="151" font-size="15" text-anchor="middle" fill="#18324a">0</text>
<circle cx="135" cy="124" r="5" fill="#8ca0b1" stroke="#8ca0b1" stroke-width="2.5"/>
<text x="135" y="151" font-size="15" text-anchor="middle" fill="#18324a">1</text>
<circle cx="212" cy="124" r="5" fill="#8ca0b1" stroke="#8ca0b1" stroke-width="2.5"/>
<text x="212" y="151" font-size="15" text-anchor="middle" fill="#18324a">2</text>
<circle cx="289" cy="124" r="5" fill="#8ca0b1" stroke="#8ca0b1" stroke-width="2.5"/>
<text x="289" y="151" font-size="15" text-anchor="middle" fill="#18324a">3</text>
<circle cx="366" cy="124" r="5" fill="#8ca0b1" stroke="#8ca0b1" stroke-width="2.5"/>
<text x="366" y="151" font-size="15" text-anchor="middle" fill="#18324a">4</text>
<circle cx="443" cy="124" r="5" fill="#8ca0b1" stroke="#8ca0b1" stroke-width="2.5"/>
<text x="443" y="151" font-size="15" text-anchor="middle" fill="#18324a">5</text>
<circle cx="520" cy="124" r="5" fill="#8ca0b1" stroke="#8ca0b1" stroke-width="2.5"/>
<text x="520" y="151" font-size="15" text-anchor="middle" fill="#18324a">6</text>
<circle cx="597" cy="124" r="5" fill="#8ca0b1" stroke="#8ca0b1" stroke-width="2.5"/>
<text x="597" y="151" font-size="15" text-anchor="middle" fill="#18324a">7</text>
<circle cx="674" cy="124" r="5" fill="#8ca0b1" stroke="#8ca0b1" stroke-width="2.5"/>
<text x="674" y="151" font-size="15" text-anchor="middle" fill="#18324a">8</text>
<circle cx="366" cy="124" r="10" fill="white" stroke="#bd6516" stroke-width="2.5"/>
<text x="366" y="98" font-size="17" text-anchor="middle" fill="#18324a">固定 v</text>
<text x="24" y="207" font-size="17" text-anchor="start" fill="#18324a">a = 2</text>
<polyline points="212,201 366,201" fill="none" stroke="#2676bb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="212" cy="201" r="5" fill="#2676bb" stroke="#2676bb" stroke-width="2.5"/>
<text x="212" y="226" font-size="14" text-anchor="middle" fill="#18324a">p=0</text>
<circle cx="289" cy="201" r="5" fill="#2676bb" stroke="#2676bb" stroke-width="2.5"/>
<text x="289" y="226" font-size="14" text-anchor="middle" fill="#18324a">p=1</text>
<circle cx="366" cy="201" r="5" fill="#2676bb" stroke="#2676bb" stroke-width="2.5"/>
<text x="366" y="226" font-size="14" text-anchor="middle" fill="#18324a">p=2</text>
<circle cx="366" cy="201" r="10" fill="white" stroke="#bd6516" stroke-width="2.5"/>
<text x="628" y="207" font-size="17" text-anchor="start" fill="#18324a">锚点 p=2</text>
<text x="24" y="270" font-size="17" text-anchor="start" fill="#18324a">a = 3</text>
<polyline points="289,264 443,264" fill="none" stroke="#2676bb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="289" cy="264" r="5" fill="#2676bb" stroke="#2676bb" stroke-width="2.5"/>
<text x="289" y="289" font-size="14" text-anchor="middle" fill="#18324a">p=0</text>
<circle cx="366" cy="264" r="5" fill="#2676bb" stroke="#2676bb" stroke-width="2.5"/>
<text x="366" y="289" font-size="14" text-anchor="middle" fill="#18324a">p=1</text>
<circle cx="443" cy="264" r="5" fill="#2676bb" stroke="#2676bb" stroke-width="2.5"/>
<text x="443" y="289" font-size="14" text-anchor="middle" fill="#18324a">p=2</text>
<circle cx="366" cy="264" r="10" fill="white" stroke="#bd6516" stroke-width="2.5"/>
<text x="628" y="270" font-size="17" text-anchor="start" fill="#18324a">锚点 p=1</text>
<text x="24" y="333" font-size="17" text-anchor="start" fill="#18324a">a = 4</text>
<polyline points="366,327 520,327" fill="none" stroke="#2676bb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="366" cy="327" r="5" fill="#2676bb" stroke="#2676bb" stroke-width="2.5"/>
<text x="366" y="352" font-size="14" text-anchor="middle" fill="#18324a">p=0</text>
<circle cx="443" cy="327" r="5" fill="#2676bb" stroke="#2676bb" stroke-width="2.5"/>
<text x="443" y="352" font-size="14" text-anchor="middle" fill="#18324a">p=1</text>
<circle cx="520" cy="327" r="5" fill="#2676bb" stroke="#2676bb" stroke-width="2.5"/>
<text x="520" y="352" font-size="14" text-anchor="middle" fill="#18324a">p=2</text>
<circle cx="366" cy="327" r="10" fill="white" stroke="#bd6516" stroke-width="2.5"/>
<text x="628" y="333" font-size="17" text-anchor="start" fill="#18324a">锚点 p=0</text>
<text x="24" y="388" font-size="16" text-anchor="start" fill="#18324a">下三行是同一条道路上的副本错层展示；橙圈都对应同一格 v。</text>
</g></svg>
