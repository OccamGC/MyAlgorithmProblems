<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" role="img" aria-labelledby="title description">
  <title id="title">Controlled vertices and their connecting path</title>
  <desc id="description">Controlled vertices 1 and 3 on the path 1-2-3-4 are connected through vertex 2. The uncontrolled vertex 2 costs 5; vertex 4 need not be visited.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#1268b3" />
    </marker>
    <marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#20354b" />
    </marker>
    <pattern id="removed" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#fff5dd" />
      <path d="M -2 2 L 2 -2 M 0 10 L 10 0 M 8 12 L 12 8" stroke="#dba963" stroke-width="1.2" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="700" height="290" fill="white" stroke="none" />
  <text x="350" y="40" fill="#20354b" font-size="25" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">S = {1, 3}</text>
  <line x1="130" y1="127" x2="235" y2="127" stroke="#1268b3" stroke-width="5" stroke-linecap="round" />
  <line x1="295" y1="127" x2="400" y2="127" stroke="#1268b3" stroke-width="5" stroke-linecap="round" />
  <line x1="460" y1="127" x2="565" y2="127" stroke="#acb9c6" stroke-width="2" stroke-linecap="round" />
  <circle cx="100" cy="127" r="30" fill="#d8efe9" stroke="#086d61" stroke-width="3" />
  <circle cx="100" cy="127" r="25" fill="none" stroke="#086d61" stroke-width="1" />
  <text x="100" y="135" fill="#20354b" font-size="24" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">1</text>
  <text x="100" y="193" fill="#086d61" font-size="21" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">v = 3</text>
  <circle cx="265" cy="127" r="30" fill="#fff0d1" stroke="#a85a04" stroke-width="3" />
  <text x="265" y="135" fill="#20354b" font-size="24" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">2</text>
  <text x="265" y="193" fill="#a85a04" font-size="21" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">v = 5</text>
  <circle cx="430" cy="127" r="30" fill="#d8efe9" stroke="#086d61" stroke-width="3" />
  <circle cx="430" cy="127" r="25" fill="none" stroke="#086d61" stroke-width="1" />
  <text x="430" y="135" fill="#20354b" font-size="24" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">3</text>
  <text x="430" y="193" fill="#086d61" font-size="21" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">v = 7</text>
  <circle cx="595" cy="127" r="30" fill="white" stroke="#acb9c6" stroke-width="3" />
  <text x="595" y="135" fill="#20354b" font-size="24" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">4</text>
  <text x="595" y="193" fill="#acb9c6" font-size="21" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">v = 11</text>
  <line x1="70" y1="230" x2="460" y2="230" stroke="#1268b3" stroke-width="3" stroke-linecap="round" />
  <text x="265" y="268" fill="#a85a04" font-size="25" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="bold">5</text>
</svg>
