<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img" aria-labelledby="title description">
  <title id="title">Spice routes</title>
  <desc id="description">Squares 1 and 3 are buyers. Circles 4 and 5 are sellers. Edges to sellers fail independently with probability one half.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#1268b3" />
    </marker>
    <marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#20354b" />
    </marker>
    <pattern id="removed" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#fff5dd" />
      <path d="M -2 2 L 2 -2 M 0 10 L 10 0 M 8 12 L 12 8" stroke="#dba963" stroke-width="1.2" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="680" height="350" fill="white" stroke="none" />
  <line x1="95" y1="80" x2="340" y2="80" stroke="#1268b3" stroke-width="3" stroke-linecap="round" />
  <text x="217.5" y="65.0" fill="#20354b" font-size="20" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">0</text>
  <line x1="340" y1="80" x2="585" y2="80" stroke="#1268b3" stroke-width="3" stroke-linecap="round" />
  <text x="462.5" y="65.0" fill="#20354b" font-size="20" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">0</text>
  <line x1="340" y1="80" x2="210" y2="255" stroke="#1268b3" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 6" />
  <text x="255.0" y="152.5" fill="#20354b" font-size="20" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">1/2</text>
  <line x1="340" y1="80" x2="470" y2="255" stroke="#1268b3" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 6" />
  <text x="425.0" y="152.5" fill="#20354b" font-size="20" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">1/2</text>
  <rect x="71" y="56" width="48" height="48" fill="#e5edf9" stroke="#1268b3" stroke-width="2" />
  <text x="95" y="87" fill="#20354b" font-size="22" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">1</text>
  <text x="95" y="126" fill="#20354b" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">H</text>
  <circle cx="340" cy="80" r="22" fill="white" stroke="#acb9c6" stroke-width="2" />
  <text x="340" y="87" fill="#20354b" font-size="22" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">2</text>
  <rect x="561" y="56" width="48" height="48" fill="#e5edf9" stroke="#1268b3" stroke-width="2" />
  <text x="585" y="87" fill="#20354b" font-size="22" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">3</text>
  <text x="585" y="126" fill="#20354b" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">H</text>
  <circle cx="210" cy="255" r="26" fill="#e5f3ea" stroke="#086d61" stroke-width="2" />
  <text x="210" y="262" fill="#20354b" font-size="22" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">4</text>
  <text x="210" y="301" fill="#20354b" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">L</text>
  <circle cx="470" cy="255" r="26" fill="#e5f3ea" stroke="#086d61" stroke-width="2" />
  <text x="470" y="262" fill="#20354b" font-size="22" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">5</text>
  <text x="470" y="301" fill="#20354b" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">L</text>
  <text x="340" y="327" fill="#20354b" font-size="23" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">1 − (1/2) × (1/2) = 3/4</text>
</svg>
