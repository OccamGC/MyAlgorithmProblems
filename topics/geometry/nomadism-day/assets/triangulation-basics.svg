  <line x1="365" y1="155" x2="220" y2="75" stroke="#1268b3" stroke-width="3" stroke-linecap="round" />
  <line x1="220" y1="75" x2="75" y2="130" stroke="#1268b3" stroke-width="3" stroke-linecap="round" />
  <line x1="75" y1="130" x2="75" y2="280" stroke="#1268b3" stroke-width="3" stroke-linecap="round" />
  <circle cx="75" cy="280" r="4.5" fill="#20354b" stroke="white" stroke-width="1" />
  <text x="58" y="302" fill="#20354b" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">A</text>
  <circle cx="325" cy="280" r="4.5" fill="#20354b" stroke="white" stroke-width="1" />
  <text x="340" y="302" fill="#20354b" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">B</text>
  <circle cx="365" cy="155" r="4.5" fill="#20354b" stroke="white" stroke-width="1" />
  <text x="380" y="141" fill="#20354b" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">C</text>
  <circle cx="220" cy="75" r="4.5" fill="#20354b" stroke="white" stroke-width="1" />
  <text x="220" y="61" fill="#20354b" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">D</text>
  <circle cx="75" cy="130" r="4.5" fill="#20354b" stroke="white" stroke-width="1" />
  <text x="58" y="116" fill="#20354b" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">E</text>
  <circle cx="210" cy="180" r="4.5" fill="#20354b" stroke="white" stroke-width="1" />
  <text x="210" y="166" fill="#20354b" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">P</text>
  <text x="225" y="34" fill="#20354b" font-size="23" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">(A)</text>
