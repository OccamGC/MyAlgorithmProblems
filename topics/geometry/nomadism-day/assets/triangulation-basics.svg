  <polygon points="660,180 670,75 525,130" fill="#edf4fb" stroke="none" />
  <line x1="660" y1="180" x2="670" y2="75" stroke="#086d61" stroke-width="2" stroke-linecap="round" />
  <polygon points="660,180 525,130 525,280" fill="#e0f1ed" stroke="none" />
  <line x1="660" y1="180" x2="525" y2="130" stroke="#086d61" stroke-width="2" stroke-linecap="round" />
  <circle cx="525" cy="280" r="4.5" fill="#20354b" stroke="white" stroke-width="1" />
  <text x="508" y="302" fill="#20354b" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">A</text>
  <circle cx="775" cy="280" r="4.5" fill="#20354b" stroke="white" stroke-width="1" />
  <text x="790" y="302" fill="#20354b" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">B</text>
  <circle cx="815" cy="155" r="4.5" fill="#20354b" stroke="white" stroke-width="1" />
  <text x="830" y="141" fill="#20354b" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">C</text>
  <circle cx="670" cy="75" r="4.5" fill="#20354b" stroke="white" stroke-width="1" />
  <text x="670" y="61" fill="#20354b" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">D</text>
  <circle cx="525" cy="130" r="4.5" fill="#20354b" stroke="white" stroke-width="1" />
  <text x="508" y="116" fill="#20354b" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">E</text>
  <circle cx="660" cy="180" r="4.5" fill="#20354b" stroke="white" stroke-width="1" />
  <text x="660" y="166" fill="#20354b" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">P</text>
  <text x="675" y="34" fill="#20354b" font-size="23" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">(B)</text>
  <text x="225" y="348" fill="#20354b" font-size="20" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">A → B → C → D → E → A</text>
  <text x="675" y="348" fill="#086d61" font-size="22" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">5 △</text>
</svg>
