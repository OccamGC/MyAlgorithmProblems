<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-labelledby="title description">
  <title id="title">Convex hull and triangulation</title>
  <desc id="description">The same six sites appear twice. A B C D E form the convex hull. Adding segments from interior site P to each hull vertex gives five triangles.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#1268b3" />
    </marker>
    <marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#20354b" />
    </marker>
    <pattern id="removed" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#fff5dd" />
      <path d="M -2 2 L 2 -2 M 0 10 L 10 0 M 8 12 L 12 8" stroke="#dba963" stroke-width="1.2" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="900" height="370" fill="white" stroke="none" />
  <line x1="450" y1="55" x2="450" y2="315" stroke="#acb9c6" stroke-width="1" stroke-linecap="round" />
  <polygon points="75,280 325,280 365,155 220,75 75,130" fill="#eef4fa" stroke="#1268b3" />
  <line x1="75" y1="280" x2="325" y2="280" stroke="#1268b3" stroke-width="3" stroke-linecap="round" />
